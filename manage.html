<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メンバー設定 | Badminton Teamizer</title>
    <link rel="stylesheet" href="main.css?v=20261011">
</head>
<body>

    <div class="page-container">
        <div class="page-header">
            <a class="btn-back" href="index.html">← 組み合わせ画面へ戻る</a>
            <h1>メンバー設定</h1>
            <p class="info-text">今日のメンバー: <strong><span id="currentMemberCount">0</span>名</strong></p>
        </div>

        <div class="page-body">
            <details class="panel-section" open>
                <summary>CSVで一括登録</summary>
                <p class="info-text">名前をカンマまたは改行で区切って貼り付けるか、CSVファイルを読み込みます。</p>
                <textarea id="csvInput" class="csv-input" rows="4" placeholder="太郎, 花子, 次郎&#10;三郎"></textarea>
                <div class="data-actions">
                    <button class="btn-add" onclick="importMembersFromText()">貼り付けた内容を追加</button>
                    <label class="btn-apply file-label">
                        CSVファイルを読み込む
                        <input type="file" id="csvFile" accept=".csv,text/csv,text/plain" onchange="importMembersFromFile(event)">
                    </label>
                </div>
                <div id="csvResult" class="csv-result"></div>
            </details>

            <details class="panel-section">
                <summary>これまでに使ったメンバー（<span id="archiveCount">0</span>名）</summary>
                <p class="info-text">タップすると今日のメンバーに追加します。✕で履歴から削除します。数字は組み合わせに入った回数です。</p>
                <div id="archiveSort"></div>
                <div id="archiveList" class="member-list"></div>
                <button class="btn-danger" onclick="clearArchive()">今日のメンバー以外を履歴から削除</button>
            </details>

            <details class="panel-section">
                <summary>データ管理</summary>
                <p class="info-text">メンバー・プリセット・コート設定・記録をまとめて保存／復元します。</p>
                <div class="data-actions">
                    <button class="btn-add" onclick="exportData()">バックアップを書き出す</button>
                    <label class="btn-apply file-label">
                        バックアップを読み込む
                        <input type="file" id="importFile" accept="application/json,.json" onchange="importData(event)">
                    </label>
                </div>
            </details>
        </div>
    </div>

    <script src="data.js?v=20261011"></script>
    <script src="manage.js?v=20261011"></script>
</body>
</html>
