<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badminton Teamizer</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>

    <div class="menu-container">
        <button class="btn-menu" onclick="toggleTimerView()">⏰ タイマー表示/非表示</button>
        <div id="timerSection" class="timer-section" style="display: none;">
            <div id="timerDisplay" class="timer-display">01:00</div>
            <div class="timer-options">
                <label><input type="radio" name="timePreset" value="60" checked onchange="updateTimerSetting()"> 1分</label>
                <label><input type="radio" name="timePreset" value="180" onchange="updateTimerSetting()"> 3分</label>
                <label><input type="radio" name="timePreset" value="300" onchange="updateTimerSetting()"> 5分</label>
                <label><input type="radio" name="timePreset" value="custom" onchange="updateTimerSetting()"> カスタム</label>
                <input type="number" id="customMin" value="10" min="1" max="99" oninput="updateTimerSetting()" style="display:none; width: 50px;">
            </div>
            <div class="timer-controls">
                <button id="startBtn" class="btn-start" onclick="toggleTimer()">スタート</button>
                <button class="btn-reset" onclick="resetTimer()">リセット</button>
            </div>
        </div>
    </div>

    <div class="config-section">
        <div class="input-group">
            <input type="text" id="nameInput" placeholder="名前を入力" onkeypress="if(event.key==='Enter') addMember()">
            <button class="btn-add" onclick="addMember()">追加</button>
            <button class="btn-manage" onclick="toggleManagePanel(true)">⚙ メンバー管理</button>
        </div>
        <div id="memberList" class="member-list"></div>
        <div class="court-selection">
            <span>使用コート数:</span>
            <label><input type="radio" name="courtCount" value="1" checked onchange="onCourtCountChange()"> 1</label>
            <label><input type="radio" name="courtCount" value="2" onchange="onCourtCountChange()"> 2</label>
            <label><input type="radio" name="courtCount" value="3" onchange="onCourtCountChange()"> 3</label>
        </div>
        <div class="mode-selection">
            <span>抽選モード:</span>
            <label><input type="radio" name="drawMode" value="normal"> 通常（ランダム）</label>
            <label><input type="radio" name="drawMode" value="smart" checked> スマート（重複回避）</label>
        </div>
        <button id="drawBtn" class="btn-draw" onclick="drawMatches()">組み合わせ作成！（0名）</button>
        <div id="drawError" class="error-text" style="display:none;"></div>
    </div>

    <div id="instruction" class="info-text" style="display:none;">
        <strong>入れ替えモード:</strong> メンバーをタップして選択、2人目をタップで入れ替え。
    </div>

    <div id="courtsContainer" class="courts-container"></div>

    <div class="waiting-room" id="waitingRoom" style="display:none;">
        <h3>待機メンバー</h3>
        <div id="waitingList" class="member-list"></div>
    </div>

    <div id="manageOverlay" class="overlay" style="display:none;" onclick="if(event.target === this) toggleManagePanel(false)">
        <div class="panel">
            <div class="panel-header">
                <h2>メンバー管理</h2>
                <button class="btn-close" onclick="toggleManagePanel(false)">✕</button>
            </div>
            <div class="panel-body">
                <details class="panel-section" open>
                    <summary>現在のメンバー（<span id="panelCurrentCount">0</span>名）</summary>
                    <p class="info-text">タップすると今日のメンバーから外します。</p>
                    <div id="panelCurrentList" class="member-list"></div>
                </details>

                <details class="panel-section">
                    <summary>プリセット（<span id="panelPresetCount">0</span>件）</summary>
                    <p class="info-text">よく使うメンバー表に名前を付けて保存しておけます。</p>
                    <div class="preset-create">
                        <input type="text" id="presetNameInput" placeholder="プリセット名（例: 水曜メンバー）">
                        <button class="btn-add" onclick="savePreset()">現在のメンバーを保存</button>
                    </div>
                    <div id="presetList" class="preset-list"></div>
                </details>

                <a class="btn-page-link" href="manage.html">メンバー設定ページを開く →</a>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
